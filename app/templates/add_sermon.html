{% extends "base.html" %}
{% block title %}New Sermon Summary – COGOP{% endblock %}

{% block content %}
<div class="page-header">
    <h1>New Sermon Summary</h1>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">← Back</a>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('sermons.create_sermon') }}">

        <div class="form-group">
            <label for="title">Sermon Title <span class="required">*</span></label>
            <input type="text" id="title" name="title" placeholder="e.g. The Power of Faith" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="speaker">Speaker <span class="required">*</span></label>
                <input type="text" id="speaker" name="speaker" placeholder="e.g. Pastor John Doe" required>
            </div>
            <div class="form-group">
                <label for="date_preached">Date Preached <span class="required">*</span></label>
                <input type="date" id="date_preached" name="date_preached" required>
            </div>
        </div>

        <div class="form-group">
            <label for="content">Summary Content <span class="required">*</span></label>
            <textarea id="content" name="content" rows="10"
                      placeholder="Enter the summary of the sermon..." required></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Publish Sermon Summary</button>
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>

    </form>
</div>
{% endblock %}
