{% extends "base.html" %}
{% block title %}New Announcement – COGOP{% endblock %}

{% block content %}
<div class="page-header">
    <h1>New Announcement</h1>
    <a href="{{ url_for('announcements.list_announcements') }}" class="btn btn-secondary">← Back</a>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('announcements.create_announcement') }}">

        <div class="form-group">
            <label for="title">Title <span class="required">*</span></label>
            <input type="text" id="title" name="title" placeholder="e.g. Sunday Service Reminder" required>
        </div>

        <div class="form-group">
            <label for="content">Content <span class="required">*</span></label>
            <textarea id="content" name="content" rows="6"
                      placeholder="Write your announcement here..." required></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Publish Announcement</button>
            <a href="{{ url_for('announcements.list_announcements') }}" class="btn btn-secondary">Cancel</a>
        </div>

    </form>
</div>
{% endblock %}
