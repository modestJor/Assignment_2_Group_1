{% extends "base.html" %}
{% block title %}New Volunteer Activity – COGOP{% endblock %}

{% block content %}
<div class="page-header">
    <h1>New Volunteer Activity</h1>
    <a href="{{ url_for('volunteers.list_activities') }}" class="btn btn-secondary">← Back</a>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('volunteers.create_activity') }}">

        <div class="form-group">
            <label for="title">Title <span class="required">*</span></label>
            <input type="text" id="title" name="title"
                   placeholder="e.g. Community Outreach Day" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date">
            </div>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location"
                   placeholder="e.g. Church Hall">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4"
                      placeholder="Describe the activity..."></textarea>
        </div>

        <div class="form-group">
            <label for="max_slots">Max Slots</label>
            <input type="number" id="max_slots" name="max_slots" min="0"
                   placeholder="0 for unlimited">

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Activity</button>
            <a href="{{ url_for('volunteers.list_activities') }}" class="btn btn-secondary">Cancel</a>
        </div>

    </form>
</div>
{% endblock %}
