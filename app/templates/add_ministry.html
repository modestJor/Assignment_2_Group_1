{% extends "base.html" %}
{% block title %}New Ministry – COGOP{% endblock %}

{% block content %}
<div class="page-header">
    <h1>New Ministry</h1>
    <a href="{{ url_for('ministries.list_ministries') }}" class="btn btn-secondary">← Back</a>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('ministries.create_ministry') }}">

        <div class="form-group">
            <label for="name">Ministry Name <span class="required">*</span></label>
            <input type="text" id="name" name="name"
                placeholder="e.g. Youth Ministry" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="leader_name">Leader Name</label>
                <input type="text" id="leader_name" name="leader_name"
                    placeholder="Full name">
            </div>
            <div class="form-group">
                <label for="leader_contact">Leader Contact</label>
                <input type="text" id="leader_contact" name="leader_contact"
                    placeholder="Phone or email">
            </div>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3"
                    placeholder="Brief description of the ministry..."></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Ministry</button>
            <a href="{{ url_for('ministries.list_ministries') }}" class="btn btn-secondary">Cancel</a>
        </div>

    </form>
</div>
{% endblock %}
